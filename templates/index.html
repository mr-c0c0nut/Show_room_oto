<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C0C0 GPT</title>
<style>
:root{--bg:#fff;--side:#f9f9f9;--line:#e5e5e5;--txt:#0d0d0d;--mut:#8a8a8a;--hover:#ececec;--acc:#2f7cf6;--red:#e5484d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
[hidden]{display:none!important}
/* auth */
#auth{height:100%;display:flex;align-items:center;justify-content:center;background:var(--side)}
.card{width:360px;max-width:92%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 6px 30px rgba(0,0,0,.06)}
.card h1{margin:0 0 4px;font-size:24px;text-align:center}
.card p.sub{margin:0 0 18px;text-align:center;color:var(--mut)}
.tabs{display:flex;background:#f0f0f0;border-radius:12px;padding:3px;margin-bottom:16px}
.tabs button{flex:1;padding:8px;border-radius:10px;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card input{width:100%;padding:11px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;font:inherit;outline:none}
.card input:focus{border-color:var(--acc)}
.card .go{width:100%;padding:11px;border-radius:12px;background:var(--txt);color:#fff;margin-top:4px}
#authErr{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;text-align:center}
/* app */
#app{display:flex;height:100%}
aside{width:280px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.brand{padding:16px 16px 8px;font-weight:700;font-size:18px}
.nav{padding:0 8px}
.nav button,.item{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.nav button:hover,.item:hover{background:var(--hover)}
.nav button.first{background:var(--hover)}
.sec{padding:16px 18px 6px;color:var(--mut);font-size:13px}
#list{flex:1;overflow:auto;padding:0 8px}
.item{font-size:14px;position:relative}
.item.on{background:var(--hover)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.item .t small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .del{opacity:0;color:var(--mut);padding:0 4px}
.item:hover .del{opacity:1}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px;white-space:nowrap}
.dot3{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.me{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:#9b59b6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.me .n{flex:1;min-width:0;line-height:1.2}.me small{color:var(--mut)}
.me button{color:var(--mut);font-size:13px;padding:6px 8px;border-radius:8px}.me button:hover{background:var(--hover)}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;align-items:center;gap:8px;padding:10px 16px;font-weight:600;min-height:48px}
#menu{display:none;font-size:20px}
#msgs{flex:1;overflow:auto;padding:8px 0 20px}
main.empty{justify-content:center}
main.empty #msgs{flex:none;overflow:visible;padding:0}
main.empty #top{position:absolute;top:0}
.hero{text-align:center;font-size:28px;font-weight:500;margin:0 0 24px;padding:0 20px}
.row{max-width:780px;margin:0 auto;padding:8px 20px;display:flex;gap:12px}
.row.u{justify-content:flex-end}
.bub{background:#f0f0f0;border-radius:20px;padding:8px 16px;max-width:75%;word-wrap:break-word}
.row.a .body{min-width:0;max-width:100%;word-wrap:break-word}
.logo{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:none}
.meta{color:var(--mut);font-size:12px;margin-top:4px}
.txt{white-space:pre-wrap}
pre{background:#0d0d0d;color:#eee;padding:12px 14px;border-radius:12px;overflow:auto;margin:8px 0;white-space:pre;font:13px/1.5 Consolas,monospace}
.pic{max-width:300px;max-height:300px;border-radius:14px;display:block;margin-bottom:6px;cursor:zoom-in}
.typing{display:flex;align-items:center;gap:6px;height:28px}
.typing i{width:8px;height:8px;border-radius:50%;background:#999;animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
#comp{max-width:780px;width:100%;margin:0 auto;padding:0 20px 18px}
#banner{background:#fff4f4;border:1px solid #f5c6c8;color:#a1262a;border-radius:12px;padding:8px 14px;margin-bottom:8px;font-size:14px}
#prev{display:flex;margin-bottom:8px}
#prev div{position:relative}
#prev img{height:64px;border-radius:10px;border:1px solid var(--line)}
#prev button{position:absolute;top:-6px;right:-6px;background:#333;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px}
.bar{display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 2px 14px rgba(0,0,0,.06);padding:8px 10px}
.bar textarea{flex:1;border:0;outline:0;resize:none;font:inherit;max-height:180px;padding:7px 4px;background:none}
.bar .plus{width:36px;height:36px;border-radius:50%;font-size:22px;color:#555}.bar .plus:hover{background:var(--hover)}
.bar .snd{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;font-size:18px}
.bar .snd:disabled,.bar .plus:disabled{opacity:.4;cursor:not-allowed}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
@media(max-width:760px){
 aside{position:fixed;z-index:5;height:100%;left:-290px;transition:left .2s}
 aside.open{left:0;box-shadow:0 0 30px rgba(0,0,0,.2)}
 #menu{display:block}.hero{font-size:22px}
}
</style>
</head>
<body>

<div id="auth" hidden>
  <div class="card">
    <h1>C0C0 GPT</h1>
    <p class="sub">Đăng nhập để bắt đầu trò chuyện</p>
    <div class="tabs"><button id="tLogin" class="on" type="button">Đăng nhập</button><button id="tReg" type="button">Tạo tài khoản</button></div>
    <form id="authForm">
      <input id="u" placeholder="Tên đăng nhập" autocomplete="username" required>
      <input id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button class="go" id="goBtn">Đăng nhập</button>
      <div id="authErr"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand">C0C0 GPT</div>
    <div class="nav"><button id="newChat" class="first">✎ <span>Trò chuyện mới</span></button></div>
    <div class="sec" id="secTitle">Gần đây</div>
    <div id="list"></div>
    <div class="me"><div class="av" id="av"></div><div class="n"><div id="meName"></div><small id="meRole"></small></div><button id="logout">Đăng xuất</button></div>
  </aside>
  <main id="main" class="empty">
    <div id="top"><button id="menu">☰</button><span id="title">C0C0 GPT</span></div>
    <div id="msgs"></div>
    <div id="comp">
      <div id="banner" hidden></div>
      <div id="prev" hidden></div>
      <div class="bar">
        <button class="plus" id="plus" title="Gửi ảnh">+</button>
        <input type="file" id="file" accept="image/*" hidden>
        <textarea id="input" rows="1" placeholder="Hỏi C0C0 GPT"></textarea>
        <button class="snd" id="snd">↑</button>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let me = null, active = null, pending = false, waitBase = 0, waitAt = 0, sig = '', file = null, mode = 'login';

async function api(url, opt = {}) {
  const r = await fetch(url, opt); let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || 'Có lỗi xảy ra');
  return d;
}
const jpost = (u, b) => api(u, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b || {})});
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const tokens = sec => Math.floor(sec * 10 / 2);          // (số giây x 10) / 2
const elapsed = () => waitBase + (Date.now() - waitAt) / 1000;

function fmt(text) {                                      // ```code``` + xuống dòng
  return text.split('```').map((p, i) => i % 2
    ? '<pre>' + esc(p.replace(/^\w*\n/, '')) + '</pre>'
    : '<span class="txt">' + esc(p) + '</span>').join('');
}

/* ---------- auth ---------- */
function setMode(m) {
  mode = m; $('#tLogin').classList.toggle('on', m === 'login'); $('#tReg').classList.toggle('on', m === 'register');
  $('#goBtn').textContent = m === 'login' ? 'Đăng nhập' : 'Tạo tài khoản'; $('#authErr').textContent = '';
}
$('#tLogin').onclick = () => setMode('login'); $('#tReg').onclick = () => setMode('register');
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  try { await jpost('/api/' + mode, {username: $('#u').value, password: $('#p').value}); $('#p').value = ''; boot(); }
  catch (err) { $('#authErr').textContent = err.message; }
};
$('#logout').onclick = async () => { await jpost('/api/logout'); active = null; boot(); };

async function boot() {
  try { me = (await api('/api/me')).user; } catch (e) { me = null; }
  $('#auth').hidden = !!me; $('#app').hidden = !me;
  if (!me) return;
  $('#meName').textContent = me.username; $('#av').textContent = me.username.slice(0, 2).toUpperCase();
  $('#meRole').textContent = me.is_admin ? 'Admin · người trả lời' : 'Free';
  $('#newChat').hidden = me.is_admin;
  $('#secTitle').textContent = me.is_admin ? 'Hộp thư đến' : 'Gần đây';
  $('#foot').textContent = me.is_admin ? 'Bạn đang trả lời với tư cách C0C0 GPT' : 'C0C0 GPT có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.';
  active = null; sig = ''; renderEmpty(); refreshList();
}

/* ---------- list ---------- */
async function refreshList() {
  if (!me) return;
  try {
    const d = await api(me.is_admin ? '/api/admin/inbox' : '/api/chats');
    $('#list').innerHTML = d.chats.map(c => me.is_admin ? `
      <button class="item ${c.id === active ? 'on' : ''}" data-id="${c.id}">
        <div class="t"><b>${esc(c.username)}</b><small>${esc(c.preview)}</small></div>
        ${c.pending ? `<span class="badge">đang chờ</span>` : ''}
      </button>` : `
      <button class="item ${c.id === active ? 'on' : ''}" data-id="${c.id}">
        <div class="t"><b>${esc(c.title)}</b></div>
        ${c.pending ? '<span class="dot3"></span>' : ''}
        <span class="del" data-del="${c.id}" title="Xóa">✕</span>
      </button>`).join('') || '<div class="sec">Chưa có hội thoại</div>';
  } catch (e) {}
}
$('#list').onclick = async e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    if (!confirm('Xóa đoạn chat này?')) return;
    await api('/api/chats/' + del.dataset.del, {method: 'DELETE'});
    if (active == del.dataset.del) { active = null; renderEmpty(); }
    return refreshList();
  }
  const it = e.target.closest('.item'); if (it) openChat(+it.dataset.id);
};
$('#newChat').onclick = () => { active = null; sig = ''; renderEmpty(); refreshList(); $('#side').classList.remove('open'); $('#input').focus(); };
$('#menu').onclick = () => $('#side').classList.toggle('open');

/* ---------- chat ---------- */
function renderEmpty() {
  $('#main').classList.add('empty'); pending = false; $('#banner').hidden = true; $('#title').textContent = 'C0C0 GPT';
  $('#msgs').innerHTML = `<div class="hero">${me && me.is_admin ? 'Chọn một hội thoại ở hộp thư để trả lời' : 'Chúng ta nên bắt đầu từ đâu?'}</div>`;
  $('#input').disabled = $('#snd').disabled = $('#plus').disabled = !!(me && me.is_admin);
}
function openChat(id) { active = id; sig = ''; loadChat(); refreshList(); $('#side').classList.remove('open'); }

async function loadChat() {
  if (!active) return;
  let d; try { d = await api('/api/chats/' + active); } catch (e) { active = null; renderEmpty(); return; }
  pending = d.waiting; waitBase = d.wait_seconds; waitAt = Date.now();
  const s = d.messages.map(m => m.id).join(',') + '|' + d.waiting;
  if (s !== sig) { sig = s; renderMsgs(d); }
  tick();
}
function renderMsgs(d) {
  const box = $('#msgs'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 120 || !box.dataset.cid || box.dataset.cid != active;
  $('#main').classList.toggle('empty', d.messages.length === 0 && !me.is_admin);
  $('#title').textContent = me.is_admin ? d.chat.username + ' · ' + d.chat.title : d.chat.title;
  $('#input').disabled = $('#snd').disabled = $('#plus').disabled = false;
  let h = d.messages.map(m => {
    const img = m.image ? `<a href="${m.image}" target="_blank"><img class="pic" src="${m.image}"></a>` : '';
    if (m.role === 'user') return `<div class="row u"><div class="bub">${img}${m.content ? fmt(m.content) : ''}</div></div>`;
    return `<div class="row a"><div class="logo">C0</div><div class="body">${img}${fmt(m.content || '')}${m.tokens ? `<div class="meta">${m.tokens} token</div>` : ''}</div></div>`;
  }).join('');
  if (d.waiting && !me.is_admin)
    h += `<div class="row a"><div class="logo">C0</div><div class="body"><div class="typing"><i></i><i></i><i></i></div><div class="meta">Đang tạo câu trả lời · <span id="tok">0</span> token</div></div></div>`;
  if (d.messages.length === 0 && !me.is_admin) h = '<div class="hero">Chúng ta nên bắt đầu từ đâu?</div>';
  box.innerHTML = h; box.dataset.cid = active;
  if (near) box.scrollTop = box.scrollHeight;
}
function tick() {                                           // cập nhật số token mỗi giây
  const t = $('#tok'); if (t) t.textContent = tokens(elapsed());
  const b = $('#banner');
  if (me && me.is_admin && active && pending) {
    b.hidden = false; b.textContent = `Người dùng đang chờ · ${Math.floor(elapsed())} giây · ${tokens(elapsed())} token`;
  } else b.hidden = true;
}
setInterval(tick, 1000);
setInterval(() => { refreshList(); loadChat(); }, 2500);

/* ---------- gửi ---------- */
async function send() {
  const ta = $('#input'), text = ta.value.trim();
  if (!text && !file) return;
  const fd = new FormData(); fd.append('text', text); if (file) fd.append('image', file);
  $('#snd').disabled = true;
  try {
    if (me.is_admin) { if (!active) return; await api(`/api/admin/chats/${active}/reply`, {method: 'POST', body: fd}); }
    else {
      if (!active) active = (await jpost('/api/chats')).id;
      await api(`/api/chats/${active}/send`, {method: 'POST', body: fd});
    }
    ta.value = ''; clearFile(); size(); sig = ''; await loadChat(); refreshList();
  } catch (e) { alert(e.message); }
  $('#snd').disabled = false;
}
$('#snd').onclick = send;
$('#input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
function size() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }
$('#input').oninput = size;
$('#plus').onclick = () => $('#file').click();
$('#file').onchange = e => {
  file = e.target.files[0]; if (!file) return;
  $('#prev').hidden = false;
  $('#prev').innerHTML = `<div><img src="${URL.createObjectURL(file)}"><button id="rm">✕</button></div>`;
  $('#rm').onclick = clearFile;
};
function clearFile() { file = null; $('#file').value = ''; $('#prev').hidden = true; $('#prev').innerHTML = ''; }

boot();
</script>
</body>
</html>
